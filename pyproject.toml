[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-md-anonymizer"
version = "0.1.1"
description = "Anonymize PDF/Markdown documents by replacing private data with reversible tokens"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["natasha"]

# Project URLs surfaced via PEP 621 metadata. The Homepage entry is what
# `importlib.metadata.metadata("pdf-md-anonymizer")` exposes as both the
# `Home-page` field (older Metadata 2.1) and `Project-URL: Homepage, …`
# (Metadata 2.2+), so the UI's GitHub button (UI-023) can resolve the repo
# URL without hardcoding it. Mirrors `[tool.briefcase].url` below.
[project.urls]
Homepage = "https://github.com/zanybaka/pdf-md-anonymizer"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.8.0",
    "mypy>=1.0",
    "basedpyright>=1.0",
    "pre-commit>=3.0",
    "vulture>=2.11",
    "pylint>=3.0",
    "radon>=5.1",
    "lizard>=1.17",
    "xenon>=0.9",
    "wily>=1.25",
]
# UI deps are kept out of the core runtime so `pip install pdf-md-anonymizer`
# (the `anon` CLI) never pulls in Toga.
ui = ["toga"]
# PDF conversion backend. Opt-in because the docling backend pulls heavy ML
# dependencies (torch + models); the core install stays light. Installed from
# git — the project is never published to PyPI, so PyPI's ban on direct-URL
# dependencies does not apply. Mirrored under [tool.briefcase] below because
# Briefcase does not read PEP 621 optional-dependencies. The distribution is
# named `pdf-to-markdown`; `pdf2md` is the CLI command it installs. The
# `backend/docling` branch is the docling-backed build (the `main` branch is a
# different, lighter backend).
pdf = ["pdf-to-markdown @ git+https://github.com/zanybaka/pdf-to-markdown@backend/docling"]

[project.scripts]
anon = "anonymizer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anonymizer"]

# The `[pdf]` extra uses a direct git reference for `pdf2md`. Hatchling rejects
# direct references by default to guard against publishing them to PyPI; this
# project is installed only from git and never published, so it is allowed.
[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
]
ignore = [
    "S603",  # subprocess without shell=True — safe, all calls use literal args
    "S607",  # partial executable path — macOS system tools, no PATH injection risk
]

[tool.ruff.lint.per-file-ignores]
# AppKit delegate methods and constants must follow macOS naming conventions
"src/anonymizer_ui/appkit_bridge/*.py" = ["N802", "N806", "N814"]
# AppKit mock stubs in tests must match ObjC selector names exactly
"tests/test_ui.py" = ["N802"]
# assert is idiomatic in pytest
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["natasha", "pymorphy2", "toga", "toga.*"]
ignore_missing_imports = true

# UI layer uses Toga (no stubs) and AppKit delegates — relax strict checks there
[[tool.mypy.overrides]]
module = ["anonymizer_ui", "anonymizer_ui.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
ignore_missing_imports = true

# NER/detect module uses natasha objects heavily (no stubs) — skip type errors
[[tool.mypy.overrides]]
module = ["anonymizer.detect", "anonymizer.detect.*"]
follow_imports = "silent"
disallow_untyped_defs = false
disallow_untyped_calls = false

# Tests don't need strict typing — shortcuts like bare strings for enums are fine
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
ignore_errors = false

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    # UI modules require a live Toga/AppKit environment — cannot run headlessly
    "src/anonymizer_ui/__main__.py",
    "src/anonymizer_ui/app.py",
    "src/anonymizer_ui/appkit_bridge.py",
    "src/anonymizer_ui/menubar_controller.py",
    "src/anonymizer_ui/pdf_backend.py",
    "src/anonymizer_ui/pdf_backend_controller.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.mutmut]
paths_to_mutate = "src/anonymizer/"
runner = "pytest -x --tb=short -q"
tests_dir = "tests/"

# Vulture (dead-code detection). The whitelist file documents ObjC selectors,
# Toga command callbacks, and the pymorphy2/pkg_resources compatibility shim
# — names vulture cannot see being called via framework dispatch or KVC.
# `ignore_names` covers signature-level framework parameters (Toga and AppKit
# delegate selectors require these argument names even when the body ignores
# them).
[tool.vulture]
paths = ["src", "vulture_whitelist.py"]
min_confidence = 80
sort_by_size = true
ignore_names = [
    "kwargs",
    "args",
    "sender",
    "self_",
    "point",
    "has_visible_windows",
]

# --- Briefcase desktop packaging (UI-001) ---------------------------------
[tool.briefcase]
project_name = "PDF/MD Anonymizer"
bundle = "io.github.zanybaka"
version = "0.1.1"
url = "https://github.com/zanybaka/pdf-md-anonymizer"
license = "MIT"
author = "ZanyBaka"
author_email = "28846209+zanybaka@users.noreply.github.com"

# The Briefcase app key must match the app's own package: Briefcase derives
# the package name from it (hyphens → underscores), so `anonymizer-ui` →
# `anonymizer_ui`, which is the UI package in `sources`. The bundled `.app` is
# named from `formal_name` below, not from this key.
[tool.briefcase.app.anonymizer-ui]
formal_name = "PDF-MD Anonymizer"
description = "Desktop UI for the PDF/MD anonymizer"
long_description = "Anonymize PDF and Markdown documents by replacing private data with reversible tokens."
sources = ["src/anonymizer", "src/anonymizer_ui"]
# The .app bundles only the light core (natasha). The docling-backed pdf2md is
# deliberately NOT bundled (ADR-0008): its native deps docling-parse /
# deepsearch-glm publish no wheels for Briefcase's macOS-11.0 / cp312 /
# --only-binary install target, and bundling docling + torch would bloat the
# distributable. PDF support is installed on first use instead — see UI-002.
requires = [
    "natasha",
    "setuptools",  # pymorphy2 imports pkg_resources at runtime
    # docopt is a transitive dep of pymorphy2 → natasha. Upstream docopt
    # 0.6.2 ships sdist-only, so Briefcase's `--only-binary :all:` install
    # cannot fetch it from PyPI and `briefcase create` fails with
    # "No matching distribution found for docopt". We vendor a locally
    # built wheel of the exact same docopt source so the install resolves
    # to that file instead of going to PyPI.
    "./vendor/docopt-0.6.2-py2.py3-none-any.whl",
]

[tool.briefcase.app.anonymizer-ui.macOS]
universal_build = false
requires = ["toga-cocoa", "std-nslog"]
info_plist = {NSHumanReadableCopyright = "© 2026 ZanyBaka · github.com/zanybaka/pdf-md-anonymizer", ProjectHomepageURL = "https://github.com/zanybaka/pdf-md-anonymizer"}
